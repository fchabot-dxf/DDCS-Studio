name: Desktop build check

# Builds the Windows exe on push/PR WITHOUT releasing, so you always have a downloadable
# DDCS-Studio.exe to smoke-test AND so PyInstaller / import / packaging breakage is caught
# early — the release workflow (desktop-release.yml) only runs on a .ver chip bump, so until
# now a broken build wasn't seen until release time. Grab the exe from the run's Artifacts.
# No tag, no GitHub release. Also runnable on demand via the Actions tab (workflow_dispatch).

on:
  push:
    branches: [main]
    paths:                                   # only the code that ships inside the exe (skip docs-only pushes)
      - 'DDCS-Studio/web/**'
      - 'bridge/bridge-app/**'
      - 'fairy_gateway.py'
      - 'build_fairy.ps1'
      - 'requirements-build.txt'
      - '.github/workflows/desktop-build-check.yml'
  pull_request:
    paths:
      - 'DDCS-Studio/web/**'
      - 'bridge/bridge-app/**'
      - 'fairy_gateway.py'
      - 'build_fairy.ps1'
      - 'requirements-build.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-build.txt'

      - name: Install build deps
        run: python -m pip install --upgrade -r requirements-build.txt

      - name: Build the exe (no release)
        shell: pwsh
        run: ./build_fairy.ps1

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDCS-Studio-exe
          path: ./DDCS-Studio.exe
          if-no-files-found: error
          retention-days: 14
