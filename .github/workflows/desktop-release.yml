name: Desktop release

# Every push to main builds the Windows exe and publishes a GitHub release, so the in-app update banner
# (ui/updateCheck.js) notifies every running exe. Version = the header .ver chip (major.minor, in
# DDCS-Studio/web/index.html) + the CI run number as the patch, so each push is a unique, monotonically
# increasing release (10.23.41 < 10.23.42 < ...). The full build version is stamped into the bundled chip at
# build time (not committed) so the exe's update-check compares correctly. Bump the chip's major.minor by hand
# for a meaningful version jump. Trigger manually via the Actions tab too (workflow_dispatch).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write                            # create the release + tag

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute build version (chip + run number) and stamp it into the bundled chip
        id: ver
        shell: pwsh
        run: |
          $html = Get-Content DDCS-Studio/web/index.html -Raw
          if ($html -notmatch 'class="ver">V([0-9][0-9.]*)<') { throw "no .ver chip found in index.html" }
          $chip = $Matches[1]
          $v = "$chip.${{ github.run_number }}"
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v"     >> $env:GITHUB_OUTPUT
          # Stamp the full build version into the bundled chip (build-only, not committed) so the exe reports it.
          $html = $html -replace '(class="ver">V)[0-9][0-9.]*(<)', ('${1}' + $v + '${2}')
          Set-Content -Path DDCS-Studio/web/index.html -Value $html -NoNewline
          Write-Host "build version: $v"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build deps
        run: python -m pip install --upgrade -r requirements-build.txt

      - name: Build the exe
        shell: pwsh
        run: ./build_fairy.ps1

      - name: Publish release (notifies running exes via the update-check)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" ./DDCS-Studio.exe `
            --title "DDCS Studio ${{ steps.ver.outputs.tag }} (desktop)" `
            --generate-notes
