<!--
  DDCS CAM icon TILESET — source of the editor's tile palette (ui/iconEditor.js → TILESET_FILES).

  HOW IT'S USED
    The editor extracts every leaf <g id="…"> (and loose id'd shapes) as one tile, cropped to its
    bounding box. You draw reusable OBJECTS here; in the editor you place / rotate / flip / scale them
    to compose 360×180 CAM-menu icons. These are STARTERS — edit the geometry/colours to your liking.

  RULES (so each object extracts as a clean tile)
    • Keep the root as-is: viewBox="0 0 880 660". The extractor mounts at the viewBox size (1 unit = 1px),
      so any canvas size works — just keep width/height matching the viewBox aspect (or use 100%).
    • One object = ONE <g id="name"> of plain shapes (path/rect/circle/line/text). NO nested <g id> inside
      an object (a group containing another id-group is treated as a container outline, not a primitive).
    • Make each object ONCE. No _BL/_BR or X+/Y- copies — the editor rotates/flips. EXCEPTION: badge_0..9
      are kept distinct (the de-dup exempts badge_/num_/digit_ ids).
    • Style on the <g> (children inherit): fill:none; stroke; stroke-width; round caps/joins. Objects sit on
      a BLACK icon background → use light/coloured strokes, never black.
    • Self-contained: no shared <defs>/gradients/clipPaths.
    • <text> rasterizes fine (default sans-serif). NOTE: edit this file then RELOAD the page to see changes.
-->
