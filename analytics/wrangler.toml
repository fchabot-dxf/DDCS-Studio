# DDCS Studio analytics — a tiny standalone Worker that receives anonymous usage events from the
# web app + the exe and writes them to Cloudflare Workers Analytics Engine. Country is derived from
# request.cf at the edge (the visitor's IP is never stored).
#
# Deploy (from analytics/):   wrangler deploy
# Wrangler prints the URL (https://ddcs-analytics.<your-subdomain>.workers.dev). Put that URL +"/e"
# into ENDPOINT in DDCS-Studio/web/ui/analytics.js and ANALYTICS_URL in fairy_gateway.py.
# Query (examples): see README.md.

name = "ddcs-analytics"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Private dashboard at GET /dash?key=<DASH_KEY>. It reads the data via the Analytics Engine SQL API,
# which needs an account id (below, not secret) + an API token (a SECRET, never in the toml):
#   wrangler secret put AE_TOKEN     # a Cloudflare API token with permission: Account Analytics → Read
#   wrangler secret put DASH_KEY     # a long random string = your private dashboard URL key
# Then:  wrangler deploy   →   open  https://ddcs-analytics.dansemur.workers.dev/dash?key=<DASH_KEY>
[vars]
ACCOUNT_ID = "014e18b89793d634a95538e7910dce19"

# Analytics Engine dataset — auto-created on first write. Bound here as env.EVENTS.
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "ddcs_events"

# Private store of the developer's own network IP(s) — so every device on a registered network is
# auto-tagged dev=1 (visit ?dev=1 once per network). Holds only YOUR own IPs, TTL'd; never exposed.
[[kv_namespaces]]
binding = "DEV_IPS"
id = "d787c20a031b44478bb893de94a27da0"

# Permanent store (D1/SQLite) for star ratings + nightly usage rollups. Bound as env.RATINGS.
# ONE-TIME SETUP (prints the database_id — paste it below, then deploy):
#   npx wrangler d1 create ddcs_ratings
#   npx wrangler d1 execute ddcs_ratings --remote --file=migrations/0001_ratings.sql
[[d1_databases]]
binding = "RATINGS"
database_name = "ddcs_ratings"
database_id = "REPLACE-WITH-D1-ID"   # ← from `wrangler d1 create ddcs_ratings`

# Nightly rollup cron — 02:30 UTC folds YESTERDAY's raw AE events into D1 `rollups` (scheduled() in src/index.js).
[triggers]
crons = ["30 2 * * *"]
